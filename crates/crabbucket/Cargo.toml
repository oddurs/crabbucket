[package]
name = "crabbucket"
description = "A static site framework in Rust, where the site is a typed value."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["static-site", "ssg", "website", "documentation"]
categories = ["web-programming", "template-engine"]

# What ships to crates.io.  An allow-list rather than a deny-list, so a new
# directory has to be added on purpose instead of being published by accident.
#
# `tests/' is deliberately absent.  Several test files read repository
# files -- doc/STABILITY, doc/crab.1 -- that a package cannot reach, and a
# test suite that cannot run is worse than one that is not there.  The tests
# live in the repository, which `repository' names.
#
# COPYING is a copy of the one at the top of the tree; a test asserts they are
# identical.  GPLv3 section 4 asks that every recipient of the source get the
# licence with it, and a .crate file is source.
include = [
    "Cargo.toml",
    "COPYING",
    "src/**/*.rs",
]

[dependencies]
crabbucket-routes.workspace = true
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
# Only what highlighting needs: the bundled syntax definitions, the HTML
# generator, and a pure-Rust regex engine so there is no C dependency.
#
# Not `default-fancy'.  That also pulls `yaml-load' for reading
# `.sublime-syntax' files at runtime, which nothing here does, and `yaml-load'
# pulls `yaml-rust', which is unmaintained and carries an advisory --
# RUSTSEC-2024-0320.  It also drops `plist-load' and `default-themes': the
# colours come from a theme's own tokens, so syntect's themes are never
# loaded.  `make audit' is what found this.
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "html",
    "regex-fancy",
] }
thiserror = "2"
toml = "0.9"
walkdir = "2"
