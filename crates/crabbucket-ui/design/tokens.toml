# The single source of truth for crabbucket's default design system.
#
# crates/crabbucket-ui/build.rs generates two things from this file: Rust
# constants, so a renamed token is a compile error, and CSS custom
# properties, so the stylesheet cannot drift from the constants.  Nothing
# else in the tree is allowed to hard-code a colour or a length.
#
# Copyright (C) 2026 Oddur Sigurdsson
# SPDX-License-Identifier: GPL-3.0-or-later

# The base palette is dark.  A `light` sub-table under any group overrides
# those tokens under `prefers-color-scheme: light` and under an explicit
# `data-theme="light"`, and every key in it must exist in the group above --
# a token that exists only in one scheme has no Rust constant to be.
[color]
surface        = "#0b0d10"
surface-raised = "#11151b"
border         = "#212832"
text           = "#e7eaf0"
text-muted     = "#98a2b3"
accent         = "#e8623c"
accent-quiet   = "#f0a58c"
link           = "#7db3ff"

[color.light]
surface        = "#ffffff"
surface-raised = "#f6f7f9"
border         = "#dfe3e8"
text           = "#1a1f26"
text-muted     = "#5b6572"
accent         = "#c2451f"
accent-quiet   = "#a33a1a"
link           = "#1b58c4"

# Syntax highlighting.  The build emits scope classes; these are the only
# place the colours behind them are written down.
[syntax]
comment     = "#6b7684"
keyword     = "#f0855f"
string      = "#8ecf9a"
constant    = "#d8a657"
entity      = "#7db3ff"
support     = "#74c7c7"
variable    = "#e7eaf0"
punctuation = "#98a2b3"
invalid     = "#ff6b6b"

[syntax.light]
comment     = "#66707d"
keyword     = "#b4501c"
string      = "#2c7a45"
constant    = "#8a5a00"
entity      = "#1b58c4"
support     = "#0f6e6e"
variable    = "#1a1f26"
punctuation = "#5b6572"
invalid     = "#c0392b"

[space]
xs = "4px"
sm = "8px"
md = "16px"
lg = "24px"
xl = "40px"
xxl = "72px"

[radius]
sm = "4px"
md = "8px"
lg = "16px"

[font]
sans = "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
mono = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace"

[size]
step--1 = "0.875rem"
step-0  = "1rem"
step-1  = "1.25rem"
step-2  = "1.625rem"
step-3  = "2.25rem"
step-4  = "3rem"

[measure]
prose = "68ch"
page  = "1080px"
