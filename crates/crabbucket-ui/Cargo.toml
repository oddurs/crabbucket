[package]
name = "crabbucket-ui"
description = "The default design system and component kit for crabbucket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["static-site", "ssg", "design-system", "components", "crabbucket"]
categories = ["web-programming", "template-engine"]

# What ships to crates.io.  An allow-list rather than a deny-list, so a new
# directory has to be added on purpose instead of being published by accident.
#
# `tests/' is deliberately absent.  Several test files read repository
# files -- doc/STABILITY, doc/crab.1 -- that a package cannot reach, and a
# test suite that cannot run is worse than one that is not there.  The tests
# live in the repository, which `repository' names.
#
# COPYING is a copy of the one at the top of the tree; a test asserts they are
# identical.  GPLv3 section 4 asks that every recipient of the source get the
# licence with it, and a .crate file is source.
include = [
    "Cargo.toml",
    "COPYING",
    "src/**",
    "design/tokens.toml",
    "build.rs",
]

[dependencies]
crabbucket.workspace = true
crabbucket-og.workspace = true
maud = "0.27"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
crabbucket-tokens.workspace = true

[dev-dependencies]
crabbucket-tokens.workspace = true
# Snapshots of a rendered page and of the stylesheet, so a change to this
# design system arrives as a reviewable diff rather than as a `contains()'
# that still passes.
insta = "1"
# To hold two claims: that the feeds and the sitemap are well-formed XML, and
# that a build produces the same bytes twice.  A parser, because "it looks like
# XML" is what every generator that emits broken XML also believes.
quick-xml = "0.38"
