[package]
name = "crabbucket-routes"
description = "Derives a site's routes from its content directory, and generates a Route enum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

# One dependency.  This is compiled during a site's build phase, before
# anything else, so `toml` -- needed to read the pages a site declares in
# site.toml -- is the most that belongs here.  A Markdown parser does not.

[dependencies]
toml = "0.9"
