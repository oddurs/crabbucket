[package]
name = "crabbucket-tokens"
description = "Generates Rust constants and CSS custom properties from a design token file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["design-tokens", "css", "codegen", "build-script", "crabbucket"]
categories = ["development-tools::build-utils", "web-programming"]

# What ships to crates.io.  An allow-list rather than a deny-list, so a new
# directory has to be added on purpose instead of being published by accident.
#
# `tests/' is deliberately absent.  Several test files read repository
# files -- doc/STABILITY, doc/crab.1 -- that a package cannot reach, and a
# test suite that cannot run is worse than one that is not there.  The tests
# live in the repository, which `repository' names.
#
# COPYING is a copy of the one at the top of the tree; a test asserts they are
# identical.  GPLv3 section 4 asks that every recipient of the source get the
# licence with it, and a .crate file is source.
include = [
    "Cargo.toml",
    "COPYING",
    "src/**/*.rs",
]

[dependencies]
toml = "0.9"
