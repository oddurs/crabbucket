[package]
name = "crabbucket-cli"
description = "The crab executable: build and check crabbucket sites."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "crab"
path = "src/main.rs"

[dependencies]
crabbucket.workspace = true
crabbucket-ui.workspace = true

[dev-dependencies]
jsonschema = { version = "0.55.0", default-features = false }
serde_json = "1.0.151"
toml = "0.9"
