name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-targets
        env:
          # Compiles the scaffolded crate against the working copy, which is
          # the only check that `crab new --theme` emits code that builds.
          CRABBUCKET_SLOW_TESTS: "1"
      - name: the example site builds
        run: cargo run -q -p crabbucket-cli -- build examples/site
