name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, so a compiler regression is a Monday problem rather than a
    # release-day one.
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stable everywhere.  Windows is the one that finds bugs: every
          # route is built from forward slashes and every path from the
          # platform's separator, and nothing on a Mac notices the difference.
          - { os: ubuntu-latest, rust: stable }
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
          # The declared minimum, on one platform.  Checking it three times
          # would buy nothing and cost three times as much.
          - { os: ubuntu-latest, rust: "1.88" }

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      # Formatting and lints are the same on every platform, so they run once.
      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest
        run: cargo nextest run --workspace --all-targets --profile ci
        env:
          # Compiles the scaffolded crate against the working copy, which is
          # the only check that `crab new --theme` emits code that builds.
          CRABBUCKET_SLOW_TESTS: "1"

      # Separately, because nothing runs both: `--all-targets` excludes
      # doctests, quietly, and it is the obvious thing to write.
      - name: doctests
        run: cargo test --workspace --doc

      # So a failure is readable in the run summary rather than only in the log.
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          annotate_only: true
          detailed_summary: true

      - name: the example site builds
        run: cargo run -q -p crabbucket-cli -- build examples/site

      - name: the example site crate builds itself
        run: cargo run -q -p crabbucket-example-site

  # A number for how much of this is tested, and a floor it may not fall
  # below.  The floor ratchets: raise it when the number rises, never lower it
  # to make a branch pass.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: cargo llvm-cov
        run: |
          make cover | tee coverage.txt
        env:
          CRABBUCKET_SLOW_TESTS: "1"

      - name: the number, where a person will see it
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            tail -3 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Licences, advisories, duplicate crates and where they came from.  This is
  # a GPL-3.0-or-later project: a licence the GPL cannot absorb is a licensing
  # bug rather than a preference.
  supply-chain:
    name: dependencies are allowed here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  # What doc/STABILITY promises, held against the branch this one came from.
  # There is no published version to compare with yet, so the baseline is the
  # merge base -- which answers the question a reviewer actually has: does
  # this pull request break the public API?
  public-api:
    name: the public API did not break
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver

      - run: |
          cargo semver-checks \
            -p crabbucket-routes -p crabbucket-tokens -p crabbucket-og \
            -p crabbucket -p crabbucket-ui -p crabbucket-theme-plain \
            -p crabbucket-cli \
            --baseline-rev "${{ github.event.pull_request.base.sha }}"

  # The build has a ceiling.  Not a tight one: a shared runner's timings vary
  # by more than any change worth making, and a budget that fails on noise is
  # a budget everybody learns to pass with a rerun.  This catches the thing
  # worth catching -- a change that makes the build several times slower --
  # and lets everything smaller through.
  budget:
    name: the build stays within budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: budget

      # Release, because a debug build measures rustc rather than crabbucket.
      - run: cargo build --release -p crabbucket-bench
      - run: ./target/release/crabbucket-bench generate 500 bench-site
      - run: ./target/release/crabbucket-bench budget bench-site 2000

  # A regression in a future compiler should arrive as a notification rather
  # than as a surprise during a release.
  beta:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
