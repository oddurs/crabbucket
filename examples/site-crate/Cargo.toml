[package]
name = "crabbucket-example-site"
description = "A crabbucket site built as a crate, with typed routes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[[bin]]
name = "crabbucket-example-site"
path = "src/main.rs"

[dependencies]
crabbucket.workspace = true
crabbucket-theme-plain.workspace = true
maud = "0.27"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
crabbucket-routes.workspace = true
