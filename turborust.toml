# The crabbucket dev loop.  Run `turborust up'.
#
# crabbucket deliberately ships no dev server of its own; see section 8 of
# doc/DESIGN.  turborust derives the watch globs from the crate's
# path-dependency closure, so editing crates/crabbucket or design/tokens.toml
# rebuilds the site without anyone having to remember to list them.
#
# Copyright (C) 2026 Oddur Sigurdsson
# SPDX-License-Identifier: GPL-3.0-or-later

[overlay]
position = "bottom-right"
emoji = "🦀"
theme = "auto"
errors = "overlay"

[tasks.site]
cargo = "crabbucket-cli"
cmd = "cargo run -q -p crabbucket-cli -- build examples/site"

[services.web]
depends_on = ["site"]
serve = { dir = "examples/site/dist", port = 8790 }
